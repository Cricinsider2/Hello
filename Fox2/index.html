<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cric Hype | Live Sports</title>

    <meta name="referrer" content="no-referrer">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- Shaka Player -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: "Inter", sans-serif;
            background: #07090f;
            color: #fff;
        }

        body {
            overflow-x: hidden;
        }

        .ambient-bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .18;
        }

        .orb-1 {
            top: -100px;
            left: -80px;
            background: #2878ff;
        }

        .orb-2 {
            right: -100px;
            bottom: -100px;
            background: #8b35ff;
        }

        header {
            position: relative;
            z-index: 2;
            padding: 18px 16px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            background: rgba(7,9,15,.72);
            backdrop-filter: blur(16px);
        }

        .header-inner {
            max-width: 1000px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #246bfe, #8b3dff);
            box-shadow: 0 8px 30px rgba(50,100,255,.25);
        }

        .brand-name {
            font-size: 19px;
            font-weight: 800;
        }

        .live-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 11px;
            border-radius: 20px;
            background: rgba(255,55,55,.1);
            border: 1px solid rgba(255,80,80,.18);
            color: #ff6b6b;
            font-size: 12px;
            font-weight: 700;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff3b3b;
            box-shadow: 0 0 10px #ff3b3b;
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .35;
                transform: scale(.75);
            }
        }

        .main-container {
            position: relative;
            z-index: 1;
            width: min(1000px, calc(100% - 24px));
            margin: 22px auto 40px;
        }

        .player-card {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 18px;
            background: #000;
            border: 1px solid rgba(255,255,255,.09);
            box-shadow: 0 20px 70px rgba(0,0,0,.4);
        }

        #playerContainer {
            width: 100%;
            height: 100%;
        }

        #video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .error-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,.82);
        }

        .error-overlay.show {
            display: flex;
        }

        .error-overlay p {
            margin: 0 0 15px;
            color: #ddd;
            font-size: 14px;
        }

        .retry-btn {
            border: 0;
            border-radius: 10px;
            padding: 11px 18px;
            background: #fff;
            color: #111;
            font-weight: 700;
            cursor: pointer;
        }

        .glass-card {
            margin-top: 16px;
            padding: 18px;
            border-radius: 18px;
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.08);
            backdrop-filter: blur(18px);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .card-title i {
            color: #6f9cff;
        }

        .glass-card p {
            margin: 0 0 15px;
            color: #9da3b3;
            line-height: 1.55;
        }

        .promo-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-social {
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,.08);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s ease, opacity .15s ease;
        }

        .btn-social:active {
            transform: scale(.97);
        }

        .btn-tg {
            background: rgba(40,160,255,.12);
            color: #38a9ff;
        }

        .btn-ig {
            background: rgba(255,70,130,.10);
            color: #ff6b9c;
        }

        .btn-share {
            width: 100%;
            background: rgba(255,255,255,.07);
            color: #fff;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            z-index: 50;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            pointer-events: none;
            padding: 11px 16px;
            border-radius: 12px;
            background: rgba(20,22,30,.94);
            border: 1px solid rgba(255,255,255,.1);
            color: #fff;
            font-size: 13px;
            transition: .25s ease;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            header {
                padding: 14px 12px;
            }

            .brand-name {
                font-size: 17px;
            }

            .main-container {
                width: calc(100% - 16px);
                margin-top: 14px;
            }

            .player-card {
                border-radius: 13px;
                aspect-ratio: 16 / 9;
            }

            .glass-card {
                padding: 15px;
                border-radius: 15px;
            }

            .promo-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
</div>

<header>
    <div class="header-inner">

        <a href="#" class="brand">
            <div class="brand-icon">
                <i class="fas fa-play"></i>
            </div>

            <span class="brand-name">
                Cric Hype
            </span>
        </a>

        <div class="live-pill">
            <span class="live-dot"></span>
            Live Stream
        </div>

    </div>
</header>

<main class="main-container">

    <div class="player-card">

        <div
            id="playerContainer"
            data-shaka-player-container
            shaka-controls="true"
        >
            <video
                id="video"
                data-shaka-player
                playsinline
                autoplay
                poster="https://chtv18.pages.dev/P.jpg"
            ></video>
        </div>

        <div id="errorOverlay" class="error-overlay">

            <p id="errorMsg">
                Stream is currently offline
            </p>

            <button
                class="retry-btn"
                onclick="location.reload()"
            >
                Try Again
            </button>

        </div>

    </div>


    <div class="glass-card">

        <div class="card-title">
            <i class="fas fa-bullhorn"></i>
            Join Community
        </div>

        <p>
            Join our official channels for updates and schedules.
        </p>

        <div class="promo-buttons">

            <a
                href="https://telegram.me/CricHype"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-social btn-tg"
            >
                <i class="fab fa-telegram-plane"></i>
                Telegram
            </a>

            <a
                href="https://instagram.com/realCricHype"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-social btn-ig"
            >
                <i class="fab fa-instagram"></i>
                Instagram
            </a>

        </div>

    </div>


    <div class="glass-card">

        <div class="card-title">
            <i class="fas fa-info-circle"></i>
            Support Us
        </div>

        <p>
            For the best experience, use Google Chrome.
            If the stream lags, try refreshing the page.
        </p>

        <button
            class="btn-social btn-share"
            onclick="shareLink()"
        >
            <i class="fas fa-share-alt"></i>
            Share Link with Friends
        </button>

    </div>

</main>


<div id="toast" class="toast">
    Loading player...
</div>


<script>
    /*
     * IMPORTANT:
     * Replace this with your own licensed/authorized
     * HLS (.m3u8) or DASH (.mpd) stream.
     */
    const STREAM_URL = "YOUR_LICENSED_STREAM_URL";


    const video = document.getElementById("video");
    const playerContainer = document.getElementById("playerContainer");
    const errorOverlay = document.getElementById("errorOverlay");
    const errorMsg = document.getElementById("errorMsg");
    const toast = document.getElementById("toast");


    function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");

        clearTimeout(window.toastTimer);

        window.toastTimer = setTimeout(() => {
            toast.classList.remove("show");
        }, 2500);
    }


    function showError(message) {
        errorMsg.textContent = message;
        errorOverlay.classList.add("show");
        showToast(message);
    }


    function hideError() {
        errorOverlay.classList.remove("show");
    }


    async function initPlayer() {

        if (!shaka.Player.isBrowserSupported()) {
            showError("Your browser does not support this video player.");
            return;
        }

        if (
            !STREAM_URL ||
            STREAM_URL === "https://in-mc-flive.fancode.com/mumbai/4248491_hindi_hls_ed24a8186993836_1ta-di_h264/1080p.m3u8?hdntl=Expires=1789392659~_GO=Generated~acl=/mumbai/4248491_hindi_hls_ed24a8186993836_1ta-di_h264/*~Signature=AWDec-HByQhk68qSCnCZyABpf45aQQnnay5WKHnruoErrGrN-vafHAIvAttH8kmxylYL3z2vHk2KCGSXRBizd32DMxwF"
        ) {
            showError("Add your licensed stream URL first.");
            return;
        }

        showToast("Loading player...");

        const player = new shaka.Player(video);

        window.shakaPlayer = player;

        player.addEventListener("error", (event) => {
            console.error("Shaka error:", event.detail);
            showError("Stream is currently unavailable.");
        });

        video.addEventListener("playing", () => {
            hideError();
            showToast("Live stream started");
        });

        try {

            await player.load(STREAM_URL);

            hideError();

            /*
             * Try autoplay.
             * If browser blocks autoplay, the Shaka play button
             * remains available.
             */
            try {
                await video.play();
            } catch (err) {
                console.log("Autoplay blocked:", err);
            }

        } catch (error) {

            console.error("Player load failed:", error);

            showError("Unable to load the stream.");

        }
    }


    async function shareLink() {

        const shareData = {
            title: "Cric Hype",
            text: "Watch Live Sports on Cric Hype",
            url: window.location.href
        };

        try {

            if (navigator.share) {

                await navigator.share(shareData);

            } else {

                await navigator.clipboard.writeText(
                    window.location.href
                );

                showToast("Link copied!");

            }

        } catch (error) {

            console.log("Share cancelled:", error);

        }
    }


    document.addEventListener("DOMContentLoaded", () => {
        initPlayer();
    });
</script>

</body>
</html>
