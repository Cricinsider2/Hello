<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Cric Hype | Live Sports</title>

    <meta name="theme-color" content="#07090f">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: "Inter", sans-serif;
            background: #07090f;
            color: #fff;
        }

        body {
            overflow-x: hidden;
        }

        /* Background */
        .ambient-bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(110px);
            opacity: .16;
        }

        .orb-1 {
            top: -120px;
            left: -100px;
            background: #2878ff;
        }

        .orb-2 {
            right: -120px;
            bottom: -120px;
            background: #8b35ff;
        }

        /* Header */
        header {
            position: relative;
            z-index: 5;

            padding: 16px;

            background: rgba(7, 9, 15, .78);
            border-bottom: 1px solid rgba(255,255,255,.08);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .header-inner {
            width: min(1000px, 100%);
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            color: #fff;
            text-decoration: none;
        }

        .brand-icon {
            width: 40px;
            height: 40px;

            display: grid;
            place-items: center;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #246bfe,
                #8b3dff
            );

            box-shadow: 0 8px 30px rgba(50,100,255,.25);
        }

        .brand-name {
            font-size: 19px;
            font-weight: 800;
        }

        .live-pill {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 7px 11px;

            border-radius: 20px;

            background: rgba(255,55,55,.10);
            border: 1px solid rgba(255,80,80,.18);

            color: #ff7070;

            font-size: 12px;
            font-weight: 700;
        }

        .live-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #ff3b3b;

            box-shadow: 0 0 10px #ff3b3b;

            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .35;
                transform: scale(.75);
            }
        }

        /* Main */
        .main-container {
            position: relative;
            z-index: 1;

            width: min(1000px, calc(100% - 20px));

            margin: 20px auto 40px;
        }

        /* Player */
        .player-card {
            position: relative;

            width: 100%;
            aspect-ratio: 16 / 9;

            overflow: hidden;

            border-radius: 18px;

            background: #000;

            border: 1px solid rgba(255,255,255,.10);

            box-shadow:
                0 20px 70px rgba(0,0,0,.45);
        }

        #streamFrame {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            border: 0;

            background: #000;
        }

        /* Loading */
        .loading {
            position: absolute;

            inset: 0;

            z-index: 2;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #000;

            pointer-events: none;

            transition: opacity .3s ease;
        }

        .loading.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader {
            width: 36px;
            height: 36px;

            border: 3px solid rgba(255,255,255,.2);
            border-top-color: #fff;

            border-radius: 50%;

            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Error */
        .error-overlay {
            position: absolute;

            inset: 0;

            z-index: 10;

            display: none;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 20px;

            background: rgba(0,0,0,.88);
        }

        .error-overlay.show {
            display: flex;
        }

        .error-icon {
            width: 55px;
            height: 55px;

            display: grid;
            place-items: center;

            margin-bottom: 12px;

            border-radius: 50%;

            background: rgba(255,255,255,.08);

            font-size: 22px;
        }

        .error-overlay h3 {
            margin: 0 0 7px;

            font-size: 16px;
        }

        .error-overlay p {
            margin: 0 0 15px;

            color: #9da3b3;

            font-size: 13px;
        }

        .retry-btn {
            min-height: 43px;

            padding: 0 18px;

            border: 0;
            border-radius: 10px;

            background: #fff;
            color: #111;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        .retry-btn:active {
            transform: scale(.96);
        }

        /* Cards */
        .glass-card {
            margin-top: 15px;

            padding: 18px;

            border-radius: 17px;

            background: rgba(255,255,255,.045);

            border: 1px solid rgba(255,255,255,.08);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 9px;

            margin-bottom: 8px;

            font-size: 16px;
            font-weight: 800;
        }

        .card-title i {
            color: #6f9cff;
        }

        .glass-card p {
            margin: 0 0 15px;

            color: #9da3b3;

            font-size: 13px;
            line-height: 1.6;
        }

        /* Buttons */
        .buttons {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;
        }

        .btn {
            min-height: 45px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            border-radius: 11px;

            border: 1px solid rgba(255,255,255,.08);

            text-decoration: none;

            font-size: 14px;
            font-weight: 700;

            transition:
                transform .15s ease,
                opacity .15s ease;
        }

        .btn:active {
            transform: scale(.97);
        }

        .telegram {
            color: #38a9ff;
            background: rgba(40,160,255,.10);
        }

        .instagram {
            color: #ff6b9c;
            background: rgba(255,70,130,.10);
        }

        .share {
            width: 100%;

            margin-top: 10px;

            background: rgba(255,255,255,.07);

            color: #fff;

            cursor: pointer;
        }

        /* Toast */
        .toast {
            position: fixed;

            left: 50%;
            bottom: 22px;

            z-index: 50;

            transform:
                translateX(-50%)
                translateY(20px);

            opacity: 0;

            pointer-events: none;

            padding: 11px 16px;

            border-radius: 12px;

            background: rgba(20,22,30,.96);

            border: 1px solid rgba(255,255,255,.10);

            color: #fff;

            font-size: 13px;

            transition: .25s ease;

            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }

        /* Mobile */
        @media (max-width: 600px) {

            header {
                padding: 13px 12px;
            }

            .brand-name {
                font-size: 17px;
            }

            .brand-icon {
                width: 37px;
                height: 37px;
            }

            .main-container {
                width: calc(100% - 12px);
                margin-top: 12px;
            }

            .player-card {
                border-radius: 12px;
            }

            .glass-card {
                padding: 15px;
                border-radius: 14px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>


    <!-- Header -->
    <header>
        <div class="header-inner">

            <a href="#" class="brand">

                <div class="brand-icon">
                    <i class="fas fa-play"></i>
                </div>

                <span class="brand-name">
                    Cric Hype
                </span>

            </a>

            <div class="live-pill">
                <span class="live-dot"></span>
                LIVE
            </div>

        </div>
    </header>


    <!-- Main -->
    <main class="main-container">

        <!-- Player -->
        <div class="player-card">

            <iframe
                id="streamFrame"
                src="https://in-mc-flive.fancode.com/mumbai/4248491_hindi_hls_ed24a8186993836_1ta-di_h264/1080p.m3u8?hdntl=Expires=1789392659~_GO=Generated~acl=/mumbai/4248491_hindi_hls_ed24a8186993836_1ta-di_h264/*~Signature=AWDec-HByQhk68qSCnCZyABpf45aQQnnay5WKHnruoErrGrN-vafHAIvAttH8kmxylYL3z2vHk2KCGSXRBizd32DMxwF"
                title="Cric Hype Live Player"
                allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
                allowfullscreen
                frameborder="0"
                scrolling="no"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>


            <!-- Loading -->
            <div
                id="loading"
                class="loading"
            >
                <div class="loader"></div>
            </div>


            <!-- Error -->
            <div
                id="errorOverlay"
                class="error-overlay"
            >

                <div class="error-icon">
                    <i class="fas fa-exclamation"></i>
                </div>

                <h3>
                    Player Unavailable
                </h3>

                <p>
                    The embedded player could not be loaded.
                </p>

                <button
                    class="retry-btn"
                    onclick="reloadFrame()"
                >
                    <i class="fas fa-rotate-right"></i>
                    Try Again
                </button>

            </div>

        </div>


        <!-- Community -->
        <div class="glass-card">

            <div class="card-title">
                <i class="fas fa-bullhorn"></i>
                Join Community
            </div>

            <p>
                Join our channels for updates, schedules
                and live sports information.
            </p>


            <div class="buttons">

                <a
                    class="btn telegram"
                    href="https://telegram.me/CricHype"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fab fa-telegram-plane"></i>
                    Telegram
                </a>


                <a
                    class="btn instagram"
                    href="https://instagram.com/realCricHype"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fab fa-instagram"></i>
                    Instagram
                </a>

            </div>

        </div>


        <!-- Share -->
        <div class="glass-card">

            <div class="card-title">
                <i class="fas fa-share-nodes"></i>
                Share
            </div>

            <p>
                Share this page with your friends.
            </p>

            <button
                class="btn share"
                onclick="sharePage()"
            >
                <i class="fas fa-share-alt"></i>
                Share Link
            </button>

        </div>

    </main>


    <!-- Toast -->
    <div
        id="toast"
        class="toast"
    >
        Link copied!
    </div>


    <script>

        const frame =
            document.getElementById("streamFrame");

        const loading =
            document.getElementById("loading");

        const errorOverlay =
            document.getElementById("errorOverlay");


        /*
         * Hide loading screen after iframe
         * has finished loading.
         */
        frame.addEventListener("load", function () {

            loading.classList.add("hide");

            errorOverlay.classList.remove("show");

        });


        /*
         * Reload iframe
         */
        function reloadFrame() {

            errorOverlay.classList.remove("show");

            loading.classList.remove("hide");

            const currentURL = frame.src;

            frame.src = "about:blank";

            setTimeout(function () {

                frame.src = currentURL;

            }, 150);

        }


        /*
         * Share page
         */
        async function sharePage() {

            const shareData = {

                title: "Cric Hype",

                text: "Watch Live Sports on Cric Hype",

                url: window.location.href

            };


            try {

                if (navigator.share) {

                    await navigator.share(
                        shareData
                    );

                } else {

                    await navigator.clipboard.writeText(
                        window.location.href
                    );

                    showToast("Link copied!");

                }

            } catch (error) {

                console.log(
                    "Share cancelled:",
                    error
                );

            }

        }


        /*
         * Toast
         */
        function showToast(message) {

            const toast =
                document.getElementById("toast");

            toast.textContent = message;

            toast.classList.add("show");

            clearTimeout(
                window.toastTimer
            );

            window.toastTimer =
                setTimeout(function () {

                    toast.classList.remove(
                        "show"
                    );

                }, 2500);

        }


        /*
         * Basic URL check
         */
        if (
            frame.src.includes(
                "YOUR_AUTHORIZED_IFRAME_URL"
            )
        ) {

            setTimeout(function () {

                loading.classList.add("hide");

                errorOverlay.classList.add("show");

            }, 1500);

        }

    </script>

</body>
</html>
