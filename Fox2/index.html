<!DOCTYPE html>
<html lang="en" data-fp="6vezd96pbed">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1,
             user-scalable=no, viewport-fit=cover"
  >

  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #player-container {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Status badge */
    #status {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      z-index: 9997;

      display: flex;
      align-items: center;
      gap: 7px;

      padding: 6px 15px 6px 11px;

      background: rgba(10, 10, 10, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.07);

      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.2px;

      border-radius: 24px;
      pointer-events: none;

      opacity: 0;
      transform: translateY(-4px);

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      white-space: nowrap;

      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);

      color: #c0c0c0;
    }

    #status.show {
      opacity: 1;
      transform: translateY(0);
    }

    .st-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
      background: #60a5fa;
    }

    #status.live .st-dot {
      background: #22d3a0;
      animation: dot-pulse 2s ease-in-out infinite;
    }

    #status.warn .st-dot {
      background: #fb923c;
      animation: dot-pulse 1s ease-in-out infinite;
    }

    #status.err .st-dot {
      background: #f87171;
    }

    @keyframes dot-pulse {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.35;
        transform: scale(0.55);
      }
    }

    /* Custom fit button */
    .sp-fit-btn {
      background: transparent !important;
      border: none !important;
      cursor: pointer !important;

      padding: 0 7px !important;
      min-width: auto !important;

      opacity: 0.75;

      display: flex;
      align-items: center;
      justify-content: center;

      height: 100%;

      transition: opacity 0.15s;
      color: #fff !important;
    }

    .sp-fit-btn:hover {
      opacity: 1;
    }

    .fit-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;

      padding: 3px 7px;

      border-radius: 4px;
      line-height: 1;

      border: 1.5px solid rgba(255, 255, 255, 0.28);

      color: rgba(255, 255, 255, 0.8);

      pointer-events: none;
      white-space: nowrap;

      transition:
        border-color 0.2s,
        color 0.2s;
    }

    .sp-fit-btn:hover .fit-pill {
      border-color: rgba(255, 255, 255, 0.55);
      color: #fff;
    }

    .sp-fit-btn.mode-fill .fit-pill {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .sp-fit-btn.mode-cover .fit-pill {
      border-color: #a78bfa;
      color: #a78bfa;
    }

    .shaka-controls-container button {
      color: #fff !important;
    }

    .shaka-video-container {
      background-color: #000 !important;
    }

    @media (max-width: 380px) {
      .fit-pill {
        font-size: 9px;
        padding: 2px 5px;
      }
    }
  </style>

  <style>
    * {
      user-select: auto !important;
      -webkit-user-select: auto !important;
    }
  </style>
</head>

<body>

  <div
    id="player-container"
    data-shaka-player-container
    class="shaka-mobile shaka-video-container"
    shaka-controls="true"
  >
    <video
      id="video"
      autoplay
      muted
      playsinline
      preload="metadata"
      class="shaka-video"
    ></video>
  </div>

  <!-- Status badge -->
  <div id="status" class="live">
    <span class="st-dot"></span>
    <span id="statusText">Live</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>

  <script>
    (function () {
      "use strict";

      // --------------------------------------------------
      // CONFIG
      // --------------------------------------------------

      const CONFIG = {
        streamUrl:
          "https://jiotvpllive.cdn.jio.com//bpk-tv/Star_Sports_HD1_BTS/WDVLive/index.mpd",

        keyId:
          "965dc2ddb1d85138ad787999a7f30ca5",

        key:
          "859695076e67fe961836b564db6d689c",

        cookieUrl:
          "https://allrounder2-0.pages.dev/api/sony-3.json"
      };


      // --------------------------------------------------
      // DOM REFERENCES
      // --------------------------------------------------

      const video =
        document.getElementById("video");

      const container =
        document.getElementById("player-container");

      const statusEl =
        document.getElementById("status");

      const statusText =
        document.getElementById("statusText");


      let statusTimer = null;


      // --------------------------------------------------
      // STATUS
      // --------------------------------------------------

      function setStatus(message, type, duration) {
        if (!statusEl) {
          return;
        }

        statusText.textContent =
          message || "Live";

        statusEl.className =
          "show " + (type || "live");

        if (statusTimer) {
          clearTimeout(statusTimer);
          statusTimer = null;
        }

        if (duration !== 0) {
          statusTimer = setTimeout(function () {
            statusEl.className =
              statusEl.className
                .replace("show", "")
                .trim();

            statusTimer = null;
          }, duration || 4000);
        }
      }


      // --------------------------------------------------
      // FIT BUTTON
      // --------------------------------------------------

      function injectFitButton(containerEl, videoEl) {
        const panel =
          containerEl.querySelector(
            ".shaka-controls-button-panel"
          );

        if (!panel) {
          return false;
        }

        const anchor =
          panel.querySelector(
            ".shaka-fullscreen-button"
          );

        const FITS = [
          "contain",
          "fill",
          "cover"
        ];

        const FIT_LABELS = {
          contain: "Fit",
          fill: "Fill",
          cover: "Zoom"
        };

        let fitIdx = 0;

        const fitBtn =
          document.createElement("button");

        fitBtn.className =
          "sp-fit-btn";

        fitBtn.title =
          "Video Fit: " +
          FIT_LABELS.contain;

        fitBtn.setAttribute(
          "aria-label",
          "Cycle Video Fit Mode"
        );

        fitBtn.innerHTML =
          '<span class="fit-pill">—</span>';


        if (anchor) {
          panel.insertBefore(
            fitBtn,
            anchor
          );
        } else {
          panel.appendChild(
            fitBtn
          );
        }


        let currentRatio = "—";


        // ----------------------------------------------
        // APPLY FIT
        // ----------------------------------------------

        function applyFit(index) {
          fitIdx = index;

          const mode =
            FITS[index];

          videoEl.classList.remove(
            "mode-fill",
            "mode-cover"
          );

          if (mode === "fill") {
            videoEl.classList.add(
              "mode-fill"
            );
          }

          if (mode === "cover") {
            videoEl.classList.add(
              "mode-cover"
            );
          }


          fitBtn.classList.remove(
            "mode-fill",
            "mode-cover"
          );

          if (mode !== "contain") {
            fitBtn.classList.add(
              "mode-" + mode
            );
          }


          fitBtn.title =
            "Video Fit: " +
            FIT_LABELS[mode];


          const pill =
            fitBtn.querySelector(
              ".fit-pill"
            );

          if (pill) {
            pill.textContent =
              mode === "contain"
                ? currentRatio
                : FIT_LABELS[mode];
          }
        }


        // ----------------------------------------------
        // BUTTON CLICK
        // ----------------------------------------------

        fitBtn.addEventListener(
          "click",
          function (event) {
            event.stopPropagation();

            applyFit(
              (fitIdx + 1) %
              FITS.length
            );
          }
        );


        // ----------------------------------------------
        // FULLSCREEN RESET
        // ----------------------------------------------

        [
          "fullscreenchange",
          "webkitfullscreenchange"
        ].forEach(function (eventName) {
          document.addEventListener(
            eventName,
            function () {
              if (
                !document.fullscreenElement &&
                !document.webkitFullscreenElement
              ) {
                applyFit(0);
              }
            }
          );
        });


        // ----------------------------------------------
        // RATIO
        // ----------------------------------------------

        function ratioLabel(width, height) {
          if (!width || !height) {
            return "—";
          }

          function gcd(a, b) {
            return b
              ? gcd(b, a % b)
              : a;
          }

          const g =
            gcd(width, height) || 1;

          const rw =
            width / g;

          const rh =
            height / g;


          const named = {
            "16:9": 16 / 9,
            "4:3": 4 / 3,
            "21:9": 21 / 9,
            "1:1": 1,
            "9:16": 9 / 16,
            "3:2": 3 / 2,
            "5:4": 5 / 4,
            "2:1": 2
          };


          const real =
            width / height;

          let best = null;
          let bestD = 0.02;


          Object.keys(named).forEach(
            function (key) {
              const difference =
                Math.abs(
                  named[key] - real
                );

              if (difference < bestD) {
                bestD = difference;
                best = key;
              }
            }
          );


          if (best) {
            return best;
          }


          if (
            rw <= 40 &&
            rh <= 40
          ) {
            return (
              rw +
              ":" +
              rh
            );
          }


          return (
            real.toFixed(2) +
            ":1"
          );
        }


        let ratioTries = 0;


        // ----------------------------------------------
        // UPDATE RATIO
        // ----------------------------------------------

        function updateRatio() {
          const pill =
            fitBtn.querySelector(
              ".fit-pill"
            );

          if (!pill) {
            return;
          }


          if (videoEl.videoWidth > 0) {
            currentRatio =
              ratioLabel(
                videoEl.videoWidth,
                videoEl.videoHeight
              );

            if (
              FITS[fitIdx] ===
              "contain"
            ) {
              pill.textContent =
                currentRatio;
            }

            ratioTries = 0;

          } else if (
            ratioTries < 15
          ) {
            ratioTries++;

            setTimeout(
              updateRatio,
              700
            );
          }
        }


        // ----------------------------------------------
        // VIDEO EVENTS
        // ----------------------------------------------

        videoEl.addEventListener(
          "loadedmetadata",
          function () {
            ratioTries = 0;
            updateRatio();
          }
        );


        videoEl.addEventListener(
          "resize",
          updateRatio
        );


        videoEl.addEventListener(
          "timeupdate",
          function onFirstFrame() {
            videoEl.removeEventListener(
              "timeupdate",
              onFirstFrame
            );

            updateRatio();
          }
        );


        updateRatio();

        return true;
      }


      // --------------------------------------------------
      // PLAYER INITIALIZATION
      // --------------------------------------------------

      async function initPlayer() {

        // ----------------------------------------------
        // SHAKA POLYFILL
        // ----------------------------------------------

        shaka.polyfill.installAll();


        if (
          !shaka.Player.isBrowserSupported()
        ) {
          setStatus(
            "Browser Not Supported",
            "err",
            0
          );

          return;
        }


        // ----------------------------------------------
        // PLAYER
        // ----------------------------------------------

        const player =
          new shaka.Player();

        await player.attach(
          video
        );


        // ----------------------------------------------
        // UI OVERLAY
        // ----------------------------------------------

        const ui =
          new shaka.ui.Overlay(
            player,
            container,
            video
          );


        ui.configure({
          addBigPlayButton: true,

          controlPanelElements: [
            "play_pause",
            "mute",
            "time_and_duration",
            "spacer",
            "quality",
            "picture_in_picture",
            "fullscreen"
          ],

          seekBarColors: {
            base: "#828282",
            buffered: "#ffc336",
            played: "#1fc7ff"
          }
        });


        // ----------------------------------------------
        // FIT BUTTON INJECTION
        // ----------------------------------------------

        let injectCount = 0;


        (function tryInject() {
          if (
            injectFitButton(
              container,
              video
            )
          ) {
            return;
          }


          if (
            ++injectCount < 5
          ) {
            setTimeout(
              tryInject,
              150
            );
          }
        })();


        // ----------------------------------------------
        // PLAYER CONFIG
        // ----------------------------------------------

        player.configure({
          drm: {
            clearKeys: {
              [CONFIG.keyId]:
                CONFIG.key
            }
          },

          manifest: {
            defaultPresentationDelay: 5
          },

          streaming: {
            lowLatencyMode: true,
            bufferingGoal: 10,
            rebufferingGoal: 2,
            safeSeekOffset: 5
          }
        });


        // ----------------------------------------------
        // COOKIE
        // ----------------------------------------------

        let cookieValue = "";


        try {
          const response =
            await fetch(
              CONFIG.cookieUrl,
              {
                cache: "no-store"
              }
            );

          const data =
            await response.json();

          cookieValue =
            data.cookie || "";

        } catch (error) {
          console.warn(
            "Cookie fetch failed, continuing without cookie"
          );
        }


        // ----------------------------------------------
        // REQUEST FILTER
        // ----------------------------------------------

        if (cookieValue) {
          player
            .getNetworkingEngine()
            .registerRequestFilter(
              (type, request) => {

                request.headers["Referer"] =
                  "https://www.jiotv.com/";

                request.headers["User-Agent"] =
                  "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";

                request.headers["Cookie"] =
                  cookieValue;


                let urlCookie =
                  cookieValue.startsWith(
                    "__hdnea__="
                  )
                    ? cookieValue.slice(10)
                    : cookieValue;


                if (
                  (
                    type ===
                      shaka.net.NetworkingEngine.RequestType.MANIFEST ||
                    type ===
                      shaka.net.NetworkingEngine.RequestType.SEGMENT
                  ) &&
                  !request.uris[0].includes(
                    "__hdnea__"
                  )
                ) {

                  const separator =
                    request.uris[0].includes("?")
                      ? "&"
                      : "?";


                  request.uris[0] +=
                    separator +
                    "__hdnea__=" +
                    urlCookie;
                }
              }
            );
        }


        // ----------------------------------------------
        // LOAD STREAM
        // ----------------------------------------------

        try {
          setStatus(
            "Loading…",
            "warn",
            0
          );


          await player.load(
            CONFIG.streamUrl
          );


          setStatus(
            "Live",
            "live",
            4000
          );


          video
            .play()
            .catch(function () {});

        } catch (error) {
          console.error(
            "Player load error:",
            error
          );

          setStatus(
            "Error loading stream",
            "err",
            0
          );
        }


        // ----------------------------------------------
        // AUTO UNMUTE
        // ----------------------------------------------

        video.addEventListener(
          "play",
          function () {
            video.muted = false;
          }
        );


        // ----------------------------------------------
        // USER INTERACTION UNMUTE
        // ----------------------------------------------

        function unmuteOnce() {
          video.muted = false;
        }


        container.addEventListener(
          "pointerdown",
          unmuteOnce,
          {
            capture: true,
            once: true
          }
        );


        container.addEventListener(
          "click",
          unmuteOnce,
          {
            capture: true,
            once: true
          }
        );


        // ----------------------------------------------
        // ERROR HANDLING
        // ----------------------------------------------

        player.addEventListener(
          "error",
          function (event) {
            const error =
              event.detail;

            setStatus(
              "Stream error: " +
                (error.code || ""),
              "err",
              5000
            );
          }
        );
      }


      // --------------------------------------------------
      // START PLAYER
      // --------------------------------------------------

      document.addEventListener(
        "DOMContentLoaded",
        initPlayer

       );

    })();

</script>
