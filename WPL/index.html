    <style>
        .hidden { display: none !important; }
        .flex { display: flex !important; }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: 'Roboto', 'Inter', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .player-shell {
            position: absolute;
            inset: 0;
            background: #000;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        .video-area {
            position: absolute;
            inset: 0;
            background: #000;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        #native-video {
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            background: #000;
            display: block;
            transition: object-fit 0.2s ease, filter 0.1s ease;
        }

        #native-video.fit-contain { object-fit: contain !important; }
        #native-video.fit-cover { object-fit: cover !important; }
        #native-video.fit-fill { object-fit: fill !important; }
        #native-video.fit-16-9 {
            object-fit: fill !important;
            aspect-ratio: 16 / 9;
            margin: auto;
        }

        .tap-surface {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: pointer;
            touch-action: none;
        }

        .brand-watermark {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 20px);
            left: env(safe-area-inset-left, 16px);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            pointer-events: none;
            opacity: 0.8;
        }

        .brand-watermark .logo-icon {
            width: 17px;
            height: 17px;
            border-radius: 5px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
        }

        .brand-watermark .text {
            font-family: 'Sora', sans-serif;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: #fff;
        }

        @media (max-width: 640px) {
            .brand-watermark { 
                top: calc(env(safe-area-inset-top, 0px) + 16px);
                left: calc(env(safe-area-inset-left, 0px) + 12px); 
                padding: 4px 8px;
            }
            .brand-watermark .text { font-size: 9px; }
            .brand-watermark .logo-icon { width: 15px; height: 15px; font-size: 9px; }
        }

        .center-spinner-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 25;
            pointer-events: none;
        }
        .loading-spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(255, 255, 255, 0.22);
            border-top-color: #ff0046;
            border-radius: 50%;
            animation: spin-loop 0.75s linear infinite;
        }
        @keyframes spin-loop {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .player-message {
            position: absolute;
            inset: 0;
            background-color: rgba(10, 10, 10, 0.94);
            text-align: center;
            padding: 0 1.5rem;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #e2e8f0;
            z-index: 55;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .retry-btn {
            background: #ff0046;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 10px 22px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s ease;
        }
        .retry-btn:hover { background: #e0003e; }

        .status-toast {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(20, 20, 20, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 7px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #fff;
            z-index: 35;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }
        .status-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Stats for Nerds Panel */
        .stats-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 12, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 8px;
            padding: 12px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            color: #e2e8f0;
            z-index: 45;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            max-width: 320px;
            line-height: 1.6;
        }
        .stats-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 6px;
            margin-bottom: 8px;
            font-weight: 700;
            color: #ff0046;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stats-close {
            cursor: pointer;
            color: #94a3b8;
            font-size: 14px;
            transition: color 0.15s;
        }
        .stats-close:hover { color: #fff; }
        .stats-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .stats-label { color: #94a3b8; }
        .stats-val { color: #38bdf8; font-weight: 600; text-align: right; }

        @media (max-width: 640px) {
            .stats-panel {
                top: 10px;
                left: 10px;
                right: 10px;
                max-width: none;
                font-size: 10.5px;
                padding: 10px 12px;
            }
        }

        /* VLC Style Center Gesture HUD */
        .gesture-hud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 15, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 22px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            z-index: 26;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }
        .gesture-hud.show { opacity: 1; }
        .gesture-hud-bar {
            width: 80px;
            height: 6px;
            background: rgba(255,255,255,0.25);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        .gesture-hud-fill {
            height: 100%;
            background: #ff0046;
            width: 0%;
        }

        .center-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px;
            height: 68px;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            z-index: 22;
            transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
        }
        .center-play-btn svg {
            width: 28px;
            height: 28px;
            fill: #fff;
            margin-left: 3px;
        }
        .center-play-btn:hover {
            transform: translate(-50%, -50%) scale(1.06);
            background: #ff0046;
            border-color: #ff0046;
        }

        .player-controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            background: linear-gradient(0deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.5) 70%, transparent 100%);
            padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 2px) 12px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .hide-controls .player-controls {
            opacity: 0;
            transform: translateY(100%);
            pointer-events: none;
        }
        .hide-controls .center-play-btn {
            opacity: 0;
            pointer-events: none;
        }

        .progress-container {
            position: relative;
            width: 100%;
            height: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .progress-rail {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.26);
            position: relative;
            transition: height 0.12s ease;
        }
        .progress-container:hover .progress-rail { height: 5px; }
        .progress-filled {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: #ff0046;
            width: 0%;
        }
        .progress-thumb {
            position: absolute;
            top: 50%;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
            transition: transform 0.12s ease;
        }
        .progress-container:hover .progress-thumb { transform: translate(-50%, -50%) scale(1); }

        .button-bar {
            width: 100%;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .control-btn {
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #d1d5db;
            border-radius: 4px;
            transition: color 0.15s, transform 0.1s;
        }
        .control-btn:hover { color: #fff; }
        .control-btn:active { transform: scale(0.92); }
        .control-btn.active { color: #ff0046; }
        .control-btn svg {
            width: 19px;
            height: 19px;
            pointer-events: none;
            fill: currentColor;
        }

        .time-display {
            font-size: 13px;
            color: #e5e7eb;
            font-variant-numeric: tabular-nums;
            margin-left: 6px;
            font-weight: 500;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #9ca3af;
            margin-left: 8px;
            letter-spacing: 0.5px;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 3px;
            transition: color 0.15s;
        }
        .live-badge.is-live { color: #ff0046; }
        .live-dot {
            width: 6px;
            height: 6px;
            background: currentColor;
            border-radius: 50%;
        }

        .ui-spacer { flex: 1; }

        .menu-wrap { position: relative; }
        .popup-menu {
            position: absolute;
            bottom: calc(100% + 10px);
            right: 0;
            background: rgba(18, 18, 18, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            border-radius: 4px;
            padding: 6px 0;
            min-width: 140px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transform: translateY(6px);
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .popup-menu.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .popup-item {
            padding: 8px 14px;
            font-size: 13px;
            color: #ccc;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.1s, color 0.1s;
        }
        .popup-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .popup-item.active {
            color: #ff0046;
            font-weight: 700;
        }
        .popup-item.active::after {
            content: "✓";
            font-size: 12px;
            color: #ff0046;
            margin-left: 8px;
        }

        @media (max-width: 640px) {
            .control-btn { width: 32px; height: 32px; }
            .control-btn svg { width: 17px; height: 17px; }
            .button-bar { height: 40px; }
            .time-display { font-size: 11px; }
            .player-controls { padding: 0 8px calc(env(safe-area-inset-bottom, 0px) + 2px) 8px; }
        }
    </style>
