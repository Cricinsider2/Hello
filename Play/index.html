<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="referrer" content="no-referrer">

<title>Shaka Player</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
background:#000;
overflow:hidden;
font-family:Arial,sans-serif;
}

.video-container{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:#000;
}

.shaka-video-container{
width:100%;
height:100%;
background:#000;
}

video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

#logo{
position:absolute;
top:10px;
right:10px;
width:60px;
z-index:9999;
pointer-events:none;
opacity:.9;
}

/* Hide spinner */

.shaka-spinner,
.shaka-spinner-container,
.shaka-spinner-svg{
display:none!important;
}

/* Seekbar */

.shaka-played-range{
background:#ff0000!important;
}

.shaka-buffered-range{
background:rgba(255,255,255,.4)!important;
}

.shaka-seek-bar{
background:rgba(255,255,255,.2)!important;
}

/* Buttons */

.shaka-controls-button-panel{
height:56px!important;
}

.shaka-controls-button-panel button{
color:#fff!important;
}

.shaka-current-time{
color:#fff!important;
}

.shaka-overflow-menu,
.shaka-settings-menu{
background:#1c1c1ce8!important;
}

</style>

</head>

<body>

<div class="video-container">

<div
class="shaka-video-container"
data-shaka-player-container>

<video
id="video"
autoplay
playsinline
muted
data-shaka-player>
</video>

<img
id="logo"
src="https://i.ibb.co/DfcTLwYL/Picsart-25-08-17-22-50-47-289.png">

</div>

</div>

<script>

const params=new URLSearchParams(location.search);

const stream=params.get("url");

if(!stream){

alert("Stream URL Missing");

throw new Error("Missing URL");

}

const video=document.getElementById("video");

const container=document.querySelector(".shaka-video-container");

const player=new shaka.Player(video);

const ui=new shaka.ui.Overlay(
player,
container,
video
);

ui.configure({

seekBarColors:{

base:"rgba(255,255,255,.2)",

buffered:"rgba(255,255,255,.4)",

played:"#ff0000"

},

controlPanelElements:[

"play_pause",

"mute",

"time_and_duration",

"spacer",

"quality",

"language",

"picture_in_picture",

"fullscreen",

"overflow_menu"

]

});

player.configure({

streaming:{

bufferingGoal:15,

rebufferingGoal:2,

bufferBehind:30

}

});async function startPlayer(){

try{

await player.load(stream);

console.log("Stream Loaded");

video.muted=false;

try{

await video.play();

}catch(e){

video.muted=true;

await video.play();

}

}catch(error){

console.error(error);

video.src=stream;

video.load();

try{

await video.play();

}catch(e){

video.muted=true;

await video.play();

}

}

}

player.addEventListener("error",event=>{

console.error("Shaka Error",event.detail);

});

video.addEventListener("waiting",()=>{

console.log("Buffering...");

});

video.addEventListener("playing",()=>{

console.log("Playing");

});

video.addEventListener("pause",()=>{

console.log("Paused");

});

video.addEventListener("ended",()=>{

console.log("Ended");

});

document.addEventListener("visibilitychange",()=>{

if(!document.hidden){

video.play().catch(()=>{});

}

});

window.addEventListener("online",()=>{

startPlayer();

});

window.addEventListener("offline",()=>{

console.log("Offline");

});

video.addEventListener("contextmenu",e=>{

e.preventDefault();

});

document.addEventListener("keydown",e=>{

switch(e.code){

case"Space":

e.preventDefault();

if(video.paused){

video.play();

}else{

video.pause();

}

break;

case"KeyF":

if(document.fullscreenElement){

document.exitFullscreen();

}else{

container.requestFullscreen();

}

break;

case"KeyM":

video.muted=!video.muted;

break;

}

});

startPlayer();video.setAttribute("playsinline","true");
video.setAttribute("webkit-playsinline","true");

video.controls=false;
video.autoplay=true;
video.preload="auto";

document.addEventListener("DOMContentLoaded",()=>{

if(shaka.Player.isBrowserSupported()){

startPlayer();

}else{

alert("Browser does not support Shaka Player.");

}

});

window.addEventListener("resize",()=>{

ui.getControls().dispatchEvent(
new Event("resize")
);

});

window.addEventListener("orientationchange",()=>{

setTimeout(()=>{

ui.getControls().dispatchEvent(
new Event("resize")
);

},300);

});

</script>

</body>
</html>
