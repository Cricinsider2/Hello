
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TG_@Cricinsider365</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.3.4/dist/controls.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

:root {
    --bg-color: #070b1a;
    --primary-red: #4f46e5;
    --primary-red-dark: #9333ea;
    --card-bg: #0f172a;
    --text-light: #e2e8f0;
    --text-muted: #94a3b8;
    --border-color: #1e293b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-light);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
}

.container {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    animation: fadeIn 0.5s ease-out forwards;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* CHANNEL NAME */

.channel-name {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 800;
    color: #e2e8f0;
    margin-bottom: 1rem;
    letter-spacing: 0.5px;
}

/* VIDEO PLAYER */

#player-container {
    width: 100%;
    aspect-ratio: 16/9;
    max-height: 70vh;
    background-color: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

/* INFO CARD */

.info-card {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 1.25rem;
    margin-top: 1rem;
    text-align: center;
}

.info-card h2 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 1rem;
    color: var(--text-muted);
}

/* TELEGRAM BUTTON */

.action-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    width: 100%;
    padding: 0.8rem 1rem;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--primary-red), var(--primary-red-dark));
    color: white;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: 0.2s ease;
}

.action-button:hover {
    transform: translateY(-2px);
}

/* CLICKABLE BANNER */

.banner-container {
    width: 100%;
    margin-top: 1rem;
    overflow: hidden;
    border-radius: 12px;
}

.banner-container a {
    display: block;
    width: 100%;
}

.banner-container img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
}

/* WHATSAPP BUTTON */

.whatsapp-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px;
    margin-top: 1rem;
    background: #25D366;
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    border-radius: 10px;
    transition: 0.2s ease;
}

.whatsapp-button i {
    font-size: 23px;
}

.whatsapp-button:hover {
    background: #1ebe5d;
    transform: translateY(-2px);
}

/* BACK LINK */

.back-link {
    display: block;
    text-align: center;
    margin-top: 1.5rem;
    color: var(--text-muted);
    text-decoration: none;
    padding: 0.5rem;
    border-radius: 8px;
}

.back-link:hover {
    background-color: var(--card-bg);
    color: var(--text-light);
}

/* TELEGRAM POPUP */

.telegram-popup {
    position: fixed;
    inset: 0;
    margin: auto;
    width: 90%;
    max-width: 400px;
    height: fit-content;
    background: #0f172a;
    padding: 30px 20px;
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(79, 70, 229, 0.6);
    text-align: center;
    display: none;
    z-index: 10000;
}

.telegram-popup h2 {
    color: var(--primary-red);
    margin-bottom: 1rem;
}

.telegram-popup button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
}

.join-btn {
    background: linear-gradient(90deg, var(--primary-red), var(--primary-red-dark));
    color: white;
}

.joined-btn {
    background: var(--border-color);
    color: white;
}

/* MOBILE RESPONSIVE */

@media (max-width: 600px) {

    .channel-name {
        font-size: 1.3rem;
    }

    .whatsapp-button {
        font-size: 15px;
    }

}

</style>
</head>

<body>

<main class="container">

<div id="stream-content">

    <!-- CHANNEL NAME -->

    <div class="channel-name">
        @Cricinsider365
    </div>

    <!-- VIDEO PLAYER -->

    <div id="player-container">

        <iframe
            src="https://newball.pages.dev/TEN1"
            style="width:100%; height:100%; border:0;"
            allow="encrypted-media; autoplay"
            allowfullscreen>
        </iframe>

    </div>

    <!-- TELEGRAM -->

    <div class="info-card">

        <h2>
            <i class="fa-solid fa-bell"></i>
            Follow us for Updates!
        </h2>

        <a
            href="https://t.me/+IhSW51QysxU3NzY1"
            target="_blank"
            class="action-button">

            <i class="fa-brands fa-telegram"></i>

            Click Here To Join Telegram

        </a>

    </div>

    <!-- CLICKABLE JPG BANNER -->

    <div class="banner-container">

        <a
            href="https://www.balaji99.life/"
            target="_blank">

            <img
                src="https://i.postimg.cc/8cjx5MF7/IMG-20261103-031456-950.jpg"
                alt="Advertisement Banner">

        </a>

    </div>

    <!-- WHATSAPP MESSAGE BUTTON -->

    <a
        href="https://w.app/balajinew1"
        target="_blank"
        class="whatsapp-button">

        <i class="fa-brands fa-whatsapp"></i>

        Message on WhatsApp

    </a>

    <!-- BACK LINK -->

    <a href="#" class="back-link">

        <i class="fa-solid fa-arrow-left"></i>

        Back to All Streams

    </a>

</div>


</script>

</body>
</html>
